<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,'Helvetica Neue',sans-serif;background:#F2EBDD;color:#2B2320}

</style>

<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2EBDD; font-family: Manrope, sans-serif; color: #2B2320">
<div style="position: absolute; left: 20px; top: 150px; width: 350px; height: 470px; box-sizing: border-box; border-radius: 50%; background: #E7DCC8; border: 2px solid #D6CCBA"></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(43, 35, 32, 0.5)"></div>

<div style="position: absolute; right: 0; top: 0; width: 322px; height: 844px; box-sizing: border-box; padding: 16px 20px 28px; background: #FFFDF8; border-radius: 24px 0 0 24px; box-shadow: -12px 0 32px rgba(40, 30, 40, 0.25); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 800">Menu</h2>
<button type="button" aria-label="Close menu" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #F2EBDD; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2320" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 18px; background: #F2EBDD">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #6E625A">ROOM</span>
<span style="font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 800; letter-spacing: 0.12em">K7QX</span>
<span style="font-size: 12px; font-weight: 600; color: #6E625A">2v2 · Round 1</span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #2B2320; background: transparent; color: #2B2320; font-family: Manrope, sans-serif; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h10"></path></svg>Copy link</button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #6E625A">CARDS LEFT</span>
<div style="display: flex; flex-direction: column; padding: 4px 0">
<span style="font-size: 12px; font-weight: 800; color: #9C4A7A; padding-top: 4px">TEAM A</span>
<div style="display: flex; align-items: center; gap: 10px; height: 36px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #9C4A7A"></span><span style="flex-grow: 1; font-size: 15px; font-weight: 800">You</span><span style="min-width: 28px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #F2EBDD; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">7</span></div><div style="display: flex; align-items: center; gap: 10px; height: 36px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #9C4A7A"></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Maya</span><span style="min-width: 28px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #F2EBDD; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">5</span></div>
<span style="font-size: 12px; font-weight: 800; color: #2E7D7A; padding-top: 8px">TEAM B</span>
<div style="display: flex; align-items: center; gap: 10px; height: 36px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2E7D7A"></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Leo</span><span style="min-width: 28px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #F2EBDD; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">6</span></div><div style="display: flex; align-items: center; gap: 10px; height: 36px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2E7D7A"></span><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Sara</span><span style="min-width: 28px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #F2EBDD; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">4</span></div>
</div>
</div>

<div style="height: 1px; background: #D6CCBA"></div>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Sound effects</span><span style="font-size: 12px; color: #6E625A">Card flips, shuffles, the last-card call</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="Sound effects" style="position: relative; flex-shrink: 0; width: 52px; height: 32px; padding: 0; border: none; border-radius: 999px; background: #2B2320"><span style="position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #FFFDF8; box-shadow: 0 1px 3px rgba(40, 30, 40, 0.3)"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Vibration</span><span style="font-size: 12px; color: #6E625A">Buzz when it is your turn</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="Vibration" style="position: relative; flex-shrink: 0; width: 52px; height: 32px; padding: 0; border: none; border-radius: 999px; background: #2B2320"><span style="position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #FFFDF8; box-shadow: 0 1px 3px rgba(40, 30, 40, 0.3)"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Highlight playable cards</span><span style="font-size: 12px; color: #6E625A">Dim the cards you cannot play</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="Highlight playable cards" style="position: relative; flex-shrink: 0; width: 52px; height: 32px; padding: 0; border: none; border-radius: 999px; background: #2B2320"><span style="position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #FFFDF8; box-shadow: 0 1px 3px rgba(40, 30, 40, 0.3)"></span></button>
</div>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" style="height: 50px; border-radius: 999px; border: none; background: #F2EBDD; color: #2B2320; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700">How to play</button>
<button type="button" style="height: 50px; border-radius: 999px; border: 2px solid #B23E28; background: transparent; color: #B23E28; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800">Leave game</button>
</div>
</div>
</div>
